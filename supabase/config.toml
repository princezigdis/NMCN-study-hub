# Supabase CLI configuration (local development + function settings).
# Link to your hosted project with:  supabase link --project-ref <your-ref>
project_id = "nmcn-study-app"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]   # DEMO content: local/staging only

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[storage]
file_size_limit = "50MiB"

[functions.ai-assist]
verify_jwt = true

[functions.payments-initialize]
verify_jwt = true

[functions.payments-verify]
verify_jwt = true

# Paystack calls this without a Supabase JWT; authenticity is checked with the
# x-paystack-signature HMAC instead.
[functions.payments-webhook]
verify_jwt = false

[functions.admin-users]
verify_jwt = true

[functions.admin-ai-test]
verify_jwt = true
